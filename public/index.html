<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUDC VoIP — Multi-Channel Telephony Console</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07111f;--bg2:#0c1a2e;--bg3:#101f35;--bg4:#142540;
  --border:#1a3050;--border2:#2a5080;
  --green:#00e87a;--green2:#006633;--green3:#002211;
  --amber:#ffaa00;--amber2:#664400;--amber3:#2a1a00;
  --red:#ff3344;--red2:#661122;--red3:#220008;
  --blue:#2299ff;--blue2:#003388;--blue3:#001122;
  --cyan:#00ccff;--cyan2:#003344;
  --text:#b8d4f0;--textdim:#3a5570;--textmed:#6a90b0;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden;}

/* ── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── SCREEN ROUTER ─────────────────────────── */
.screen{display:none}
.screen.active{display:flex;flex-direction:column;min-height:100vh}

/* ══════════════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════════════ */
#loginScreen{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#0a2040 0%,var(--bg) 70%)}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:36px 32px;width:380px;max-width:95vw}
.brand{text-align:center;margin-bottom:28px}
.brand-logo{font-size:11px;color:var(--textdim);letter-spacing:4px;margin-bottom:6px}
.brand-name{font-size:28px;color:var(--amber);letter-spacing:6px;font-weight:bold}
.brand-sub{font-size:10px;color:var(--textdim);letter-spacing:3px;margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;color:var(--textdim);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;font-family:inherit;font-size:14px;outline:none;border-radius:4px;transition:border-color .2s}
.field input:focus{border-color:var(--blue)}
.connect-btn{width:100%;margin-top:8px;padding:13px;background:var(--blue3);border:1px solid var(--blue2);color:var(--blue);font-family:inherit;font-size:13px;font-weight:bold;letter-spacing:3px;cursor:pointer;border-radius:4px;transition:all .15s;text-transform:uppercase}
.connect-btn:hover{background:var(--blue2);border-color:var(--blue)}
.connect-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--red);font-size:11px;text-align:center;margin-top:10px;min-height:16px}

/* ══════════════════════════════════════════════
   MAIN CONSOLE
══════════════════════════════════════════════ */
#mainScreen{flex-direction:column}

/* ── HEADER ────────────────────────────────── */
.hdr{background:var(--bg2);border-bottom:2px solid var(--border2);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-left{display:flex;flex-direction:column}
.hdr-title{font-size:17px;font-weight:bold;color:var(--amber);letter-spacing:4px}
.hdr-sub{font-size:9px;color:var(--textdim);letter-spacing:2px;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:18px}
.clock{font-size:22px;color:var(--green);font-weight:bold;letter-spacing:3px;font-variant-numeric:tabular-nums}
.user-badge{text-align:left}
.user-name{font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px}
.user-status{font-size:9px;color:var(--textdim);letter-spacing:1px}

/* ── LED ───────────────────────────────────── */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.led-g{background:var(--green);box-shadow:0 0 6px var(--green)}
.led-a{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led-r{background:var(--red);box-shadow:0 0 6px var(--red)}
.led-off{background:#1a2a3a;box-shadow:none}

/* ── MASTER PANEL ──────────────────────────── */
.master{background:var(--bg3);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
.m-group{display:flex;align-items:center;gap:8px}
.m-label{font-size:9px;color:var(--textdim);letter-spacing:2px;white-space:nowrap;text-transform:uppercase}
.m-val{font-size:10px;color:var(--blue);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.sep{width:1px;height:32px;background:var(--border);flex-shrink:0}
.spacer{flex:1}

/* Sliders */
input[type=range]{-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer;border:none}

/* Buttons */
.btn{padding:5px 12px;border:1px solid var(--border);background:var(--bg);color:var(--textmed);font-family:inherit;font-size:11px;cursor:pointer;border-radius:3px;transition:all .1s;white-space:nowrap;user-select:none;letter-spacing:1px;text-transform:uppercase}
.btn:hover{border-color:var(--textmed);color:var(--text)}
.btn.on-g{border-color:var(--green2);color:var(--green);background:var(--green3)}
.btn.on-r{border-color:var(--red2);color:var(--red);background:var(--red3)}
.btn.on-a{border-color:var(--amber2);color:var(--amber);background:var(--amber3)}

/* PTT ALL */
.ptt-all{padding:9px 22px;background:var(--red3);border:2px solid var(--red2);color:var(--red);font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:2px;cursor:pointer;border-radius:4px;user-select:none;transition:all .1s;touch-action:none}
.ptt-all:active,.ptt-all.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 20px rgba(255,51,68,.5)}
.hotkey{display:inline-block;font-size:9px;padding:1px 4px;border:1px solid var(--textdim);border-radius:2px;color:var(--textdim);margin-left:4px}

/* ── ADD CHANNEL BAR ───────────────────────── */
.add-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 18px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.add-bar.open{display:flex}
.add-bar input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-family:inherit;font-size:12px;outline:none;border-radius:3px;width:120px}
.add-bar input:focus{border-color:var(--blue)}

/* ── CHANNELS GRID ─────────────────────────── */
.grid-wrap{flex:1;overflow-y:auto;padding:14px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

/* ── CHANNEL CARD ──────────────────────────── */
.ch-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.ch-card.joined{border-color:var(--border2)}
.ch-card.rx{border-color:var(--green);box-shadow:0 0 12px rgba(0,232,122,.15)}
.ch-card.tx{border-color:var(--amber);box-shadow:0 0 14px rgba(255,170,0,.2)}

.ch-head{background:var(--bg2);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.ch-id{font-size:15px;font-weight:bold;color:var(--amber);letter-spacing:2px}
.ch-name{font-size:10px;color:var(--textdim);margin-top:1px}
.ch-indics{display:flex;gap:5px;align-items:center}
.indic{font-size:9px;font-weight:bold;padding:2px 5px;border-radius:2px;letter-spacing:1px;transition:all .15s}
.indic-rx{background:var(--green3);color:var(--green);border:1px solid var(--green2)}
.indic-rx.on{background:var(--green);color:#000;border-color:var(--green)}
.indic-tx{background:var(--amber3);color:var(--amber);border:1px solid var(--amber2)}
.indic-tx.on{background:var(--amber);color:#000;border-color:var(--amber)}

.ch-body{padding:11px 13px}

/* VU Meter */
.vu{height:5px;background:var(--bg);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.vu-fill{height:100%;width:0%;background:linear-gradient(to right,var(--green) 0%,var(--amber) 70%,var(--red) 100%);background-size:300% 100%;transition:width .04s ease-out}

/* Mic VU */
.mic-vu{height:4px;background:var(--bg);border:1px solid var(--amber2);border-radius:3px;overflow:hidden;margin:4px 0 6px}
.mic-vu-fill{height:100%;width:0%;background:var(--amber);transition:width .04s ease-out}

/* Participants */
.participants{display:flex;flex-wrap:wrap;gap:4px;min-height:22px;margin:4px 0}
.ptag{font-size:10px;padding:2px 7px;background:var(--blue3);border:1px solid var(--blue2);border-radius:2px;color:var(--blue);transition:all .2s}
.ptag.speaking{background:var(--green3);border-color:var(--green2);color:var(--green)}
.ptag.speaking::before{content:"▶ "}
.no-peers{font-size:10px;color:var(--textdim)}

/* Volume row */
.vol-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.vol-icon{font-size:12px;cursor:pointer;user-select:none}
input[type=range].vol-slider{flex:1;width:100%}

/* Controls row */
.ctrl-row{display:flex;gap:6px;align-items:center;margin:6px 0}
.ctrl-btn{padding:4px 9px;border:1px solid var(--border);background:var(--bg);color:var(--textdim);font-family:inherit;font-size:10px;cursor:pointer;border-radius:3px;transition:all .1s;user-select:none;letter-spacing:.5px}
.ctrl-btn:hover{color:var(--text);border-color:var(--textmed)}
.ctrl-btn.muted{background:var(--red3);border-color:var(--red2);color:var(--red)}
.ctrl-btn.joined{background:var(--red3);border-color:var(--red2);color:var(--red)}
.ctrl-btn.notjoined{background:var(--green3);border-color:var(--green2);color:var(--green)}
.peer-count{font-size:10px;color:var(--textdim);margin-left:auto}

/* PTT Button */
.ptt-btn{width:100%;padding:13px;margin-top:8px;background:var(--bg);border:2px solid var(--amber2);color:var(--amber);font-family:inherit;font-size:13px;font-weight:bold;letter-spacing:3px;cursor:pointer;border-radius:4px;user-select:none;touch-action:none;transition:all .1s;text-transform:uppercase}
.ptt-btn:disabled{opacity:.3;cursor:not-allowed}
.ptt-btn.active{background:var(--amber);color:#000;border-color:var(--amber);box-shadow:0 0 20px rgba(255,170,0,.4);transform:scale(.99)}

/* Chat */
.ch-chat{border-top:1px solid var(--border);padding:8px 13px}
.chat-log{max-height:80px;overflow-y:auto;font-size:10px;color:var(--textmed);margin-bottom:6px;display:flex;flex-direction:column;gap:3px}
.chat-msg{display:flex;gap:6px}
.chat-who{color:var(--blue);flex-shrink:0}
.chat-txt{color:var(--text)}
.chat-input-row{display:flex;gap:6px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-family:inherit;font-size:11px;outline:none;border-radius:3px}
.chat-input:focus{border-color:var(--blue2)}
.chat-send{padding:5px 10px;background:var(--blue3);border:1px solid var(--blue2);color:var(--blue);font-family:inherit;font-size:10px;cursor:pointer;border-radius:3px}

/* ── STATUS BAR ────────────────────────────── */
.statusbar{background:var(--bg2);border-top:1px solid var(--border);padding:5px 18px;display:flex;align-items:center;gap:18px;font-size:10px;color:var(--textdim);flex-shrink:0;flex-wrap:wrap}
.s-item{display:flex;align-items:center;gap:5px}

/* ── RESPONSIVE ────────────────────────────── */
@media(max-width:600px){
  .channels-grid{grid-template-columns:1fr}
  .hdr-right{gap:10px}
  .clock{font-size:16px}
  .master{gap:8px}
  .ptt-all{padding:8px 14px;font-size:11px}
}

/* Animations */
@keyframes rxpulse{0%,100%{opacity:1}50%{opacity:.6}}
.rx .indic-rx.on{animation:rxpulse .6s infinite}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">AUDC SYSTEMS</div>
      <div class="brand-name">VoIP</div>
      <div class="brand-sub">MULTI-CHANNEL TELEPHONY CONSOLE</div>
    </div>
    <div class="field">
      <label>שם / CALL SIGN</label>
      <input id="inName" type="text" placeholder="OPS-1" maxlength="20" autocomplete="off"/>
    </div>
    <div class="field">
      <label>שרת / SERVER URL</label>
      <input id="inServer" type="text" autocomplete="off"/>
    </div>
    <button class="connect-btn" id="connectBtn" onclick="APP.connect()">התחבר &nbsp;/&nbsp; CONNECT</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN CONSOLE -->
<div id="mainScreen" class="screen">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-title">⬡ AUDC VoIP CONSOLE</div>
      <div class="hdr-sub">MULTI-CHANNEL TELEPHONY SYSTEM</div>
    </div>
    <div class="hdr-right">
      <div id="clock" class="clock">00:00:00</div>
      <div class="user-badge">
        <div class="user-name"><span class="led led-g"></span><span id="hdrName">—</span></div>
        <div class="user-status">CONNECTED</div>
      </div>
    </div>
  </div>

  <!-- Master Controls -->
  <div class="master">
    <div class="m-group">
      <span class="m-label">VOL מאסטר</span>
      <input type="range" min="0" max="1" step="0.01" value="1" style="width:100px"
             id="masterVolSlider"
             oninput="APP.setMasterVol(+this.value)">
      <span class="m-val" id="masterVolVal">100%</span>
    </div>
    <div class="sep"></div>
    <button class="btn" id="masterMuteBtn" onclick="APP.toggleMasterMute()">השתק הכל</button>
    <div class="sep"></div>
    <!-- Mic Level indicator -->
    <div class="m-group" style="flex-direction:column;gap:2px;align-items:flex-start">
      <span class="m-label">MIC LEVEL</span>
      <div class="mic-vu" style="width:100px"><div class="mic-vu-fill" id="micVU"></div></div>
    </div>
    <div class="sep"></div>
    <div class="spacer"></div>
    <button class="ptt-all" id="pttAllBtn"
            onmousedown="APP.pttAllStart(event)" onmouseup="APP.pttAllStop()"
            ontouchstart="APP.pttAllStart(event)" ontouchend="APP.pttAllStop()">
      📡 שידור לכולם <span class="hotkey">SPACE</span>
    </button>
    <div class="sep"></div>
    <button class="btn" onclick="APP.toggleAddBar()">+ ערוץ חדש</button>
    <button class="btn" onclick="APP.disconnect()">התנתק</button>
  </div>

  <!-- Add Channel Bar -->
  <div class="add-bar" id="addBar">
    <span class="m-label">הוסף ערוץ:</span>
    <input id="newChId" type="text" placeholder="CH-007" style="width:90px" maxlength="12"/>
    <input id="newChName" type="text" placeholder="שם ערוץ" style="width:130px" maxlength="24"/>
    <button class="btn on-g" onclick="APP.addChannel()">הוסף</button>
    <button class="btn" onclick="APP.toggleAddBar()">ביטול</button>
  </div>

  <!-- Channels Grid -->
  <div class="grid-wrap">
    <div class="channels-grid" id="grid"></div>
  </div>

  <!-- Status Bar -->
  <div class="statusbar">
    <div class="s-item"><span class="led led-g"></span><span>SYSTEM ONLINE</span></div>
    <div class="s-item" id="sbChannels">ערוצים: 0 פעילים</div>
    <div class="s-item" id="sbPTT">PTT: IDLE</div>
    <div class="s-item" id="sbPeers">כולל: 0 משתתפים</div>
    <div style="flex:1"></div>
    <div class="s-item">AUDC VOIP SYSTEM · v1.0</div>
  </div>
</div>

<script>
/* =====================================================
   AUDC VoIP Multi-Channel Telephony System
   Architecture:
   - Socket.io for WebRTC signaling
   - One RTCPeerConnection per (peer × channel)
   - Per-channel Web Audio GainNode for independent PTT
   - Mic → per-channel GainNode → WebRTC track
   - Incoming streams → per-peer GainNode → masterGain → speakers
===================================================== */

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' }
];

const DEFAULT_CHANNELS = [
  { id: 'CH-001', name: 'קו כללי' },
  { id: 'CH-002', name: 'ועידה 1' },
  { id: 'CH-003', name: 'ועידה 2' },
  { id: 'CH-004', name: 'ערוץ חירום' },
  { id: 'CH-005', name: 'קו ניהול' },
  { id: 'CH-006', name: 'שידור כללי' },
];

// ── Channel State ──────────────────────────────────────────────────────────
class ChannelState {
  constructor(id, name, system) {
    this.id = id;
    this.name = name;
    this.sys = system;
    this.joined = false;
    this.muted = false;
    this.volume = 1.0;
    this.transmitting = false;
    this.peers = {};     // peerId → { name, pc, srcNode, gainNode, analyser, speaking, audioEl }
    this.outGain = null; // GainNode for outgoing mic (0=muted, 1=transmit)
    this.outStream = null;
    this.micSrc = null;
    this.vuAnim = null;
    this.messages = [];  // chat messages
  }

  initAudio() {
    const ctx = this.sys.audioCtx;
    // Route mic through a per-channel gain so we can PTT independently
    this.micSrc = ctx.createMediaStreamSource(this.sys.localStream);
    this.outGain = ctx.createGain();
    this.outGain.gain.value = 0; // silent until PTT
    const dest = ctx.createMediaStreamDestination();
    this.micSrc.connect(this.outGain);
    this.outGain.connect(dest);
    this.outStream = dest.stream;
  }

  addPeer(peerId, peerName, weInitiate) {
    if (this.peers[peerId]) return;
    if (!this.outStream) this.initAudio();

    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    this.peers[peerId] = { name: peerName, pc, srcNode: null, gainNode: null, analyser: null, speaking: false, audioEl: null };

    // Outgoing: add per-channel mic track
    const track = this.outStream.getAudioTracks()[0];
    if (track) pc.addTrack(track, this.outStream);

    // Incoming
    pc.ontrack = (e) => this._setupIncoming(peerId, e.streams[0]);

    // ICE
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        this.sys.socket.emit('signal', {
          to: peerId,
          channelId: this.id,
          signal: { type: 'candidate', candidate: e.candidate }
        });
      }
    };

    pc.onconnectionstatechange = () => this.sys.ui.refresh(this.id);
    pc.oniceconnectionstatechange = () => this.sys.ui.refresh(this.id);

    if (weInitiate) {
      pc.createOffer({ offerToReceiveAudio: true })
        .then(o => { pc.setLocalDescription(o); return o; })
        .then(o => {
          this.sys.socket.emit('signal', {
            to: peerId, channelId: this.id,
            signal: { type: 'offer', sdp: o }
          });
        });
    }
  }

  handleSignal(fromId, signal) {
    if (signal.type === 'offer' && !this.peers[fromId]) {
      this.addPeer(fromId, fromId, false);
    }
    const peer = this.peers[fromId];
    if (!peer) return;

    if (signal.type === 'offer') {
      peer.pc.setRemoteDescription(new RTCSessionDescription(signal.sdp))
        .then(() => peer.pc.createAnswer())
        .then(a => { peer.pc.setLocalDescription(a); return a; })
        .then(a => {
          this.sys.socket.emit('signal', {
            to: fromId, channelId: this.id,
            signal: { type: 'answer', sdp: a }
          });
        });
    } else if (signal.type === 'answer') {
      peer.pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    } else if (signal.type === 'candidate' && signal.candidate) {
      peer.pc.addIceCandidate(new RTCIceCandidate(signal.candidate)).catch(() => {});
    }
  }

  _setupIncoming(peerId, stream) {
    const peer = this.peers[peerId];
    if (!peer || !stream) return;
    const ctx = this.sys.audioCtx;

    // Clean up old nodes
    if (peer.gainNode) try { peer.gainNode.disconnect(); } catch(e) {}
    if (peer.analyser) try { peer.analyser.disconnect(); } catch(e) {}
    if (peer.srcNode) try { peer.srcNode.disconnect(); } catch(e) {}

    const srcNode = ctx.createMediaStreamSource(stream);
    const gainNode = ctx.createGain();
    gainNode.gain.value = this.muted ? 0 : this.volume;
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;

    srcNode.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(this.sys.masterGain);

    peer.srcNode = srcNode;
    peer.gainNode = gainNode;
    peer.analyser = analyser;

    // Also attach to audio element to prevent GC
    if (!peer.audioEl) {
      peer.audioEl = new Audio();
      peer.audioEl.srcObject = stream;
      peer.audioEl.muted = true;
    }

    this._startVU();
    this.sys.ui.refresh(this.id);
  }

  _startVU() {
    if (this.vuAnim) return;
    const tick = () => {
      let max = 0;
      for (const p of Object.values(this.peers)) {
        if (!p.analyser) continue;
        const d = new Uint8Array(p.analyser.frequencyBinCount);
        p.analyser.getByteFrequencyData(d);
        const avg = d.reduce((s, v) => s + v, 0) / d.length / 128;
        max = Math.max(max, avg);
      }
      const el = document.getElementById('vu-' + this.id);
      if (el) el.style.width = Math.min(max * 100, 100) + '%';
      this.vuAnim = requestAnimationFrame(tick);
    };
    this.vuAnim = requestAnimationFrame(tick);
  }

  setTransmitting(v) {
    this.transmitting = v;
    if (this.outGain) this.outGain.gain.value = v ? 1 : 0;
  }

  updateGain() {
    for (const p of Object.values(this.peers)) {
      if (p.gainNode) p.gainNode.gain.value = this.muted ? 0 : this.volume;
    }
  }

  removePeer(peerId) {
    const p = this.peers[peerId];
    if (!p) return;
    try { p.pc.close(); } catch(e) {}
    try { if (p.gainNode) p.gainNode.disconnect(); } catch(e) {}
    try { if (p.analyser) p.analyser.disconnect(); } catch(e) {}
    try { if (p.srcNode) p.srcNode.disconnect(); } catch(e) {}
    delete this.peers[peerId];
  }

  cleanup() {
    if (this.vuAnim) { cancelAnimationFrame(this.vuAnim); this.vuAnim = null; }
    for (const id of Object.keys(this.peers)) this.removePeer(id);
    try { if (this.outGain) this.outGain.disconnect(); } catch(e) {}
    try { if (this.micSrc) this.micSrc.disconnect(); } catch(e) {}
    this.outStream = null;
  }

  isRX() { return Object.values(this.peers).some(p => p.speaking); }
  peerList() { return Object.values(this.peers).map(p => ({ name: p.name, speaking: p.speaking })); }
  peerCount() { return Object.keys(this.peers).length; }
}

// ── VoIP System ────────────────────────────────────────────────────────────
class VoIPSystem {
  constructor() {
    this.socket = null;
    this.localStream = null;
    this.audioCtx = null;
    this.masterGain = null;
    this.masterVol = 1.0;
    this.masterMuted = false;
    this.micAnalyser = null;
    this.channels = {};
    this.activePTT = new Set();
    this.displayName = '';
    this.ui = new UI(this);
    this.clockInterval = null;
    this.micVUAnim = null;
  }

  async connect(name, serverUrl) {
    this.displayName = name;

    // Mic access
    try {
      this.localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
    } catch (e) {
      return 'שגיאה בגישה למיקרופון: ' + e.message;
    }

    // Audio context
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();

    this.masterGain = this.audioCtx.createGain();
    this.masterGain.gain.value = this.masterVol;
    this.masterGain.connect(this.audioCtx.destination);

    // Mic level analyser (for VU in master panel)
    this.micAnalyser = this.audioCtx.createAnalyser();
    this.micAnalyser.fftSize = 256;
    const micSrc = this.audioCtx.createMediaStreamSource(this.localStream);
    micSrc.connect(this.micAnalyser);
    this._startMicVU();

    // Signaling
    this.socket = io(serverUrl);

    await new Promise((resolve, reject) => {
      this.socket.on('connect', resolve);
      this.socket.on('connect_error', reject);
      setTimeout(reject, 8000);
    });

    this._setupSocketHandlers();
    return null; // success
  }

  _setupSocketHandlers() {
    this.socket.on('channel-peers', ({ channelId, peers }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      for (const p of peers) ch.addPeer(p.id, p.name, true);
    });

    this.socket.on('peer-joined', ({ channelId, peerId, name }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      ch.addPeer(peerId, name, false);
      this.ui.refresh(channelId);
    });

    this.socket.on('peer-left', ({ channelId, peerId }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      ch.removePeer(peerId);
      this.ui.refresh(channelId);
    });

    this.socket.on('signal', ({ from, channelId, signal }) => {
      const ch = this.channels[channelId];
      if (!ch || !ch.joined) return;
      ch.handleSignal(from, signal);
    });

    this.socket.on('ptt-start', ({ peerId, channelId }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      const p = ch.peers[peerId];
      if (p) p.speaking = true;
      this.ui.refresh(channelId);
    });

    this.socket.on('ptt-stop', ({ peerId, channelId }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      const p = ch.peers[peerId];
      if (p) p.speaking = false;
      this.ui.refresh(channelId);
    });

    this.socket.on('chat', ({ channelId, text, name }) => {
      const ch = this.channels[channelId];
      if (!ch) return;
      ch.messages.push({ name, text });
      if (ch.messages.length > 50) ch.messages.shift();
      this.ui.appendChat(channelId, name, text);
    });
  }

  joinChannel(id) {
    const ch = this.channels[id];
    if (!ch || ch.joined) return;
    ch.joined = true;
    this.socket.emit('join-channel', { channelId: id, displayName: this.displayName });
    this.ui.refresh(id);
    this._updateStatusBar();
  }

  leaveChannel(id) {
    const ch = this.channels[id];
    if (!ch || !ch.joined) return;
    this.stopPTT(id);
    ch.cleanup();
    ch.joined = false;
    this.socket.emit('leave-channel', { channelId: id });
    this.ui.refresh(id);
    this._updateStatusBar();
  }

  startPTT(id) {
    const ch = this.channels[id];
    if (!ch || !ch.joined || this.activePTT.has(id)) return;
    this.activePTT.add(id);
    ch.setTransmitting(true);
    this.socket.emit('ptt-start', { channelId: id });
    this.ui.refresh(id);
    this._updateStatusBar();
  }

  stopPTT(id) {
    if (!this.activePTT.has(id)) return;
    this.activePTT.delete(id);
    const ch = this.channels[id];
    if (ch) {
      ch.setTransmitting(false);
      this.socket.emit('ptt-stop', { channelId: id });
      this.ui.refresh(id);
    }
    this._updateStatusBar();
  }

  startPTTAll() {
    for (const id of Object.keys(this.channels)) {
      if (this.channels[id].joined) this.startPTT(id);
    }
    document.getElementById('pttAllBtn').classList.add('active');
  }

  stopPTTAll() {
    for (const id of Object.keys(this.channels)) this.stopPTT(id);
    document.getElementById('pttAllBtn').classList.remove('active');
  }

  setChannelVol(id, val) {
    const ch = this.channels[id];
    if (!ch) return;
    ch.volume = val;
    ch.updateGain();
  }

  toggleChannelMute(id) {
    const ch = this.channels[id];
    if (!ch) return;
    ch.muted = !ch.muted;
    ch.updateGain();
    this.ui.refresh(id);
  }

  setMasterVol(val) {
    this.masterVol = val;
    if (this.masterGain) this.masterGain.gain.value = this.masterMuted ? 0 : val;
    document.getElementById('masterVolVal').textContent = Math.round(val * 100) + '%';
  }

  toggleMasterMute() {
    this.masterMuted = !this.masterMuted;
    if (this.masterGain) this.masterGain.gain.value = this.masterMuted ? 0 : this.masterVol;
    const btn = document.getElementById('masterMuteBtn');
    btn.textContent = this.masterMuted ? '🔇 כל-האודיו מושתק' : 'השתק הכל';
    btn.className = this.masterMuted ? 'btn on-r' : 'btn';
  }

  addChannel(id, name) {
    if (this.channels[id]) return;
    this.channels[id] = new ChannelState(id, name || id, this);
    this.ui.renderCard(id);
    this._updateStatusBar();
  }

  sendChat(channelId, text) {
    if (!text.trim()) return;
    const ch = this.channels[channelId];
    if (!ch || !ch.joined) return;
    this.socket.emit('chat', { channelId, text: text.trim(), name: this.displayName });
  }

  _startMicVU() {
    const tick = () => {
      if (!this.micAnalyser) return;
      const d = new Uint8Array(this.micAnalyser.frequencyBinCount);
      this.micAnalyser.getByteFrequencyData(d);
      const avg = d.reduce((s, v) => s + v, 0) / d.length / 128;
      // Show mic VU only when any PTT active
      const level = this.activePTT.size > 0 ? Math.min(avg * 100, 100) : 0;
      const el = document.getElementById('micVU');
      if (el) el.style.width = level + '%';
      this.micVUAnim = requestAnimationFrame(tick);
    };
    this.micVUAnim = requestAnimationFrame(tick);
  }

  _updateStatusBar() {
    const joined = Object.values(this.channels).filter(c => c.joined).length;
    const peers = Object.values(this.channels).reduce((n, c) => n + c.peerCount(), 0);
    const sbCh = document.getElementById('sbChannels');
    const sbPTT = document.getElementById('sbPTT');
    const sbPeers = document.getElementById('sbPeers');
    if (sbCh) sbCh.textContent = `ערוצים: ${joined} פעילים`;
    if (sbPTT) sbPTT.textContent = this.activePTT.size ? 'TX: ' + [...this.activePTT].join(', ') : 'PTT: IDLE';
    if (sbPeers) sbPeers.textContent = `כולל: ${peers} משתתפים`;
  }
}

// ── UI ─────────────────────────────────────────────────────────────────────
class UI {
  constructor(sys) { this.sys = sys; }

  showMain() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('mainScreen').classList.add('active');
    document.getElementById('hdrName').textContent = this.sys.displayName;
    this._startClock();
    this._setupGlobalKeys();
  }

  renderCard(id) {
    const grid = document.getElementById('grid');
    if (!grid) return;
    const div = document.createElement('div');
    div.id = 'card-' + id;
    div.innerHTML = this._cardHTML(id);
    grid.appendChild(div);
  }

  refresh(id) {
    const wrap = document.getElementById('card-' + id);
    if (!wrap) return;
    wrap.innerHTML = this._cardHTML(id);
    this.sys._updateStatusBar();
  }

  _cardHTML(id) {
    const ch = this.sys.channels[id];
    const isTX = this.sys.activePTT.has(id);
    const isRX = ch.isRX();
    const peers = ch.peerList();
    const cls = ['ch-card', ch.joined ? 'joined' : '', isRX ? 'rx' : '', isTX ? 'tx' : ''].filter(Boolean).join(' ');

    const peerTags = ch.joined
      ? (peers.length
          ? peers.map(p => `<span class="ptag${p.speaking ? ' speaking' : ''}">${p.name}</span>`).join('')
          : `<span class="no-peers">אין משתתפים נוספים</span>`)
      : `<span class="no-peers">לא מחובר לערוץ</span>`;

    const chatMsgs = ch.messages.slice(-6).map(m =>
      `<div class="chat-msg"><span class="chat-who">${m.name}:</span><span class="chat-txt">${escHtml(m.text)}</span></div>`
    ).join('');

    return `<div class="${cls}" id="card-${id}">
  <div class="ch-head">
    <div>
      <div class="ch-id">${id}</div>
      <div class="ch-name">${ch.name}</div>
    </div>
    <div class="ch-indics">
      <span class="indic indic-rx${isRX ? ' on' : ''}">RX</span>
      <span class="indic indic-tx${isTX ? ' on' : ''}">TX</span>
    </div>
  </div>
  <div class="ch-body">
    <div class="participants" id="pts-${id}">${peerTags}</div>
    <div class="vu"><div class="vu-fill" id="vu-${id}"></div></div>
    <div class="vol-row">
      <span class="vol-icon" title="השתק/הפעל" onclick="APP.toggleMute('${id}')">${ch.muted ? '🔇' : '🔊'}</span>
      <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="${ch.volume}"
             ${!ch.joined ? 'disabled' : ''}
             oninput="APP.setVol('${id}',+this.value);document.getElementById('vv-${id}').textContent=Math.round(this.value*100)+'%'">
      <span id="vv-${id}" class="m-val">${Math.round(ch.volume * 100)}%</span>
    </div>
    <div class="ctrl-row">
      ${ch.joined
        ? `<button class="ctrl-btn joined" onclick="APP.leave('${id}')">עזוב</button>`
        : `<button class="ctrl-btn notjoined" onclick="APP.join('${id}')">הצטרף</button>`}
      <button class="ctrl-btn ${ch.muted ? 'muted' : ''}" onclick="APP.toggleMute('${id}')" ${!ch.joined ? 'disabled' : ''}>
        ${ch.muted ? 'בטל השתקה' : 'השתק שמיעה'}
      </button>
      <span class="peer-count">${peers.length} משתתף${peers.length !== 1 ? 'ים' : ''}</span>
    </div>
    <button class="ptt-btn${isTX ? ' active' : ''}" id="ptt-${id}"
            ${!ch.joined ? 'disabled' : ''}
            onmousedown="APP.pttStart('${id}',event)" onmouseup="APP.pttStop('${id}')"
            ontouchstart="APP.pttStart('${id}',event)" ontouchend="APP.pttStop('${id}')"
            onmouseleave="APP.pttStop('${id}')">
      ${isTX ? '🔴 TX — שידור פעיל...' : '📡 PTT — לחץ לשידור'}
    </button>
  </div>
  <div class="ch-chat">
    <div class="chat-log" id="clog-${id}">${chatMsgs}</div>
    <div class="chat-input-row">
      <input class="chat-input" id="cin-${id}" type="text" placeholder="הקלד הודעה..." maxlength="200"
             ${!ch.joined ? 'disabled' : ''}
             onkeydown="if(event.key==='Enter')APP.sendChat('${id}')">
      <button class="chat-send" onclick="APP.sendChat('${id}')" ${!ch.joined ? 'disabled' : ''}>שלח</button>
    </div>
  </div>
</div>`;
  }

  appendChat(channelId, name, text) {
    const log = document.getElementById('clog-' + channelId);
    if (!log) return;
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="chat-who">${name}:</span><span class="chat-txt">${escHtml(text)}</span>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  _startClock() {
    const tick = () => {
      const n = new Date();
      const t = [n.getHours(), n.getMinutes(), n.getSeconds()]
        .map(v => String(v).padStart(2, '0')).join(':');
      const el = document.getElementById('clock');
      if (el) el.textContent = t;
    };
    tick();
    this.sys.clockInterval = setInterval(tick, 1000);
  }

  _setupGlobalKeys() {
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        APP.pttAllStart(e);
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space') APP.pttAllStop();
    });
  }
}

// ── App Controller ──────────────────────────────────────────────────────────
const APP = {
  system: new VoIPSystem(),

  async connect() {
    const name = (document.getElementById('inName').value.trim() || 'OPS-' + Math.floor(Math.random() * 900 + 100));
    const server = document.getElementById('inServer').value.trim() || window.location.origin;
    const btn = document.getElementById('connectBtn');
    const err = document.getElementById('loginErr');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'מתחבר...';

    const error = await this.system.connect(name, server);
    if (error) {
      err.textContent = error;
      btn.disabled = false;
      btn.textContent = 'התחבר / CONNECT';
      return;
    }

    this.system.ui.showMain();

    // Init default channels
    for (const ch of DEFAULT_CHANNELS) {
      this.system.addChannel(ch.id, ch.name);
    }
  },

  join(id) { this.system.joinChannel(id); },
  leave(id) { this.system.leaveChannel(id); },

  pttStart(id, e) { if (e) e.preventDefault(); this.system.startPTT(id); },
  pttStop(id) { this.system.stopPTT(id); },

  pttAllStart(e) { if (e) e.preventDefault(); this.system.startPTTAll(); },
  pttAllStop() { this.system.stopPTTAll(); },

  setVol(id, v) { this.system.setChannelVol(id, v); },
  toggleMute(id) { this.system.toggleChannelMute(id); },

  toggleMasterMute() { this.system.toggleMasterMute(); },

  addChannel() {
    const id = document.getElementById('newChId')?.value?.trim().toUpperCase();
    const name = document.getElementById('newChName')?.value?.trim();
    if (!id) return;
    if (this.system.channels[id]) { alert('ערוץ ' + id + ' כבר קיים'); return; }
    this.system.addChannel(id, name || id);
    document.getElementById('addBar').classList.remove('open');
    document.getElementById('newChId').value = '';
    document.getElementById('newChName').value = '';
  },

  toggleAddBar() {
    document.getElementById('addBar').classList.toggle('open');
  },

  sendChat(channelId) {
    const inp = document.getElementById('cin-' + channelId);
    if (!inp) return;
    this.system.sendChat(channelId, inp.value);
    inp.value = '';
  },

  disconnect() {
    if (!confirm('להתנתק מהמערכת?')) return;
    for (const id of Object.keys(this.system.channels)) {
      if (this.system.channels[id].joined) this.system.leaveChannel(id);
    }
    if (this.system.socket) this.system.socket.disconnect();
    if (this.system.clockInterval) clearInterval(this.system.clockInterval);
    location.reload();
  }
};

// ── Helpers ────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Set default server URL
document.getElementById('inServer').value = window.location.origin;

// Prevent context menu on PTT buttons (long press on mobile)
document.addEventListener('contextmenu', (e) => {
  if (e.target.classList.contains('ptt-btn') || e.target.classList.contains('ptt-all')) {
    e.preventDefault();
  }
});
</script>
